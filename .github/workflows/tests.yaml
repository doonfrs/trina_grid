name: Flutter Test
on:
    pull_request:
        branches: [main]

    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable # or: beta, master (or main)

            - name: Get all Flutter Packages
              run: flutter pub get

            # dart analyze covers the whole repository, and demo/ is a separate
            # package. Without its own resolution every package: import there is
            # unresolved, including demo's self-references.
            - name: Get Demo Packages
              run: flutter pub get
              working-directory: demo

            - name: Analyze
              run: dart analyze

            - name: Run Flutter Test
              run: flutter test
