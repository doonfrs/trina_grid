name: Flutter Test
on:
    pull_request:
        branches: [main]

    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable # or: beta, master (or main)

            - name: Get all Flutter Packages
              run: flutter pub get

            - name: Analyze
              run: dart analyze

            - name: Run Flutter Test
              run: flutter test
